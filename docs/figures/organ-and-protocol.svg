<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#0f1116"/>
  <text x="600" y="38" text-anchor="middle" fill="#e6e6e6" font-size="20" font-weight="bold">The organ, the model that reads it, and the test that can fail (RESULTS rows 13b, 21 to 29, 36 to 40)</text>
  <text x="600" y="60" text-anchor="middle" fill="#9aa0a6" font-size="13">quantum-cortex, original figure. Green: measured and validated at 27M. Amber: measured, the limit. Grey: built, not yet measured on the model. Numbers are the graved ones.</text>

  <!-- ===== left panel: the organ ===== -->
  <rect x="30" y="85" width="540" height="330" rx="10" fill="#161a22" stroke="#2b3240"/>
  <text x="300" y="112" text-anchor="middle" fill="#e6e6e6" font-size="16" font-weight="bold">The organ (C2b): a journal outside the weights</text>

  <!-- write path -->
  <rect x="55" y="135" width="150" height="58" rx="8" fill="#1f3a2a" stroke="#3fae6a"/>
  <text x="130" y="158" text-anchor="middle" fill="#dff5e6" font-size="12" font-weight="bold">Write gate</text>
  <text x="130" y="176" text-anchor="middle" fill="#bfe8cc" font-size="11">admits by surprise</text>

  <rect x="225" y="135" width="150" height="58" rx="8" fill="#1f3a2a" stroke="#3fae6a"/>
  <text x="300" y="158" text-anchor="middle" fill="#dff5e6" font-size="12" font-weight="bold">Sealed store</text>
  <text x="300" y="176" text-anchor="middle" fill="#bfe8cc" font-size="11">encrypted at rest, per subject</text>

  <rect x="395" y="135" width="150" height="58" rx="8" fill="#1f3a2a" stroke="#3fae6a"/>
  <text x="470" y="158" text-anchor="middle" fill="#dff5e6" font-size="12" font-weight="bold">Cue index</text>
  <text x="470" y="176" text-anchor="middle" fill="#bfe8cc" font-size="11">recall by cue, k lines</text>

  <line x1="205" y1="164" x2="225" y2="164" stroke="#9aa0a6" stroke-width="2"/>
  <line x1="375" y1="164" x2="395" y2="164" stroke="#9aa0a6" stroke-width="2"/>

  <!-- lifecycle -->
  <rect x="55" y="215" width="490" height="52" rx="8" fill="#20242c" stroke="#4a5262"/>
  <text x="300" y="237" text-anchor="middle" fill="#d0d4da" font-size="12" font-weight="bold">Lifecycle: consolidation and eviction by persistence ("noise is what never contributes")</text>
  <text x="300" y="255" text-anchor="middle" fill="#9aa0a6" font-size="11">built and tested; its effect on recall over long horizons not yet measured on the model</text>

  <!-- organ verdict -->
  <rect x="55" y="290" width="490" height="100" rx="8" fill="#12261a" stroke="#3fae6a" stroke-width="1.5"/>
  <text x="300" y="315" text-anchor="middle" fill="#8fe0a8" font-size="13" font-weight="bold">Molaison dissociation on the organ: PASS, 4 seeds, persistent, claimable</text>
  <text x="300" y="338" text-anchor="middle" fill="#dff5e6" font-size="12">recall with the journal 1.000, without it 0.000; skill delta 0</text>
  <text x="300" y="358" text-anchor="middle" fill="#dff5e6" font-size="12">never planted entities: 0.00 to 0.055 claimed (line 0.10); reopened from the disk in a new process</text>
  <text x="300" y="378" text-anchor="middle" fill="#9aa0a6" font-size="11">reproduces in minutes on a CPU (notebooks/reproduce_molaison_cpu.ipynb)</text>

  <!-- ===== right panel: the model reading the organ ===== -->
  <rect x="630" y="85" width="540" height="330" rx="10" fill="#161a22" stroke="#2b3240"/>
  <text x="900" y="112" text-anchor="middle" fill="#e6e6e6" font-size="16" font-weight="bold">The model reading the organ (27M, nine fine tunes, three seeds on v9)</text>

  <rect x="655" y="135" width="150" height="58" rx="8" fill="#1f3a2a" stroke="#3fae6a"/>
  <text x="730" y="158" text-anchor="middle" fill="#dff5e6" font-size="12" font-weight="bold">Cue encoder</text>
  <text x="730" y="176" text-anchor="middle" fill="#bfe8cc" font-size="11">retrieval hit 0.87 to 0.98</text>

  <rect x="825" y="135" width="150" height="58" rx="8" fill="#1f3a2a" stroke="#3fae6a"/>
  <text x="900" y="158" text-anchor="middle" fill="#dff5e6" font-size="12" font-weight="bold">Reader (cross attention)</text>
  <text x="900" y="176" text-anchor="middle" fill="#bfe8cc" font-size="11">attention mass 0.96 to 0.996</text>

  <rect x="995" y="135" width="150" height="58" rx="8" fill="#3a2e14" stroke="#d9a441"/>
  <text x="1070" y="158" text-anchor="middle" fill="#ffe9bf" font-size="12" font-weight="bold">Decision: cite or abstain</text>
  <text x="1070" y="176" text-anchor="middle" fill="#f3d79a" font-size="11">a prior; moves with the mark</text>

  <line x1="805" y1="164" x2="825" y2="164" stroke="#9aa0a6" stroke-width="2"/>
  <line x1="975" y1="164" x2="995" y2="164" stroke="#9aa0a6" stroke-width="2"/>

  <!-- the organ feeds the model -->
  <path d="M 545 164 C 600 164, 600 100, 655 100" fill="none" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="600" y="92" text-anchor="middle" fill="#9aa0a6" font-size="10">the window</text>

  <rect x="655" y="215" width="490" height="52" rx="8" fill="#3a2e14" stroke="#d9a441"/>
  <text x="900" y="237" text-anchor="middle" fill="#ffe9bf" font-size="12" font-weight="bold">Grounding: valid citations up to 0.795 (v9); strict recall 0.795 alone, 0.890 as a system</text>
  <text x="900" y="255" text-anchor="middle" fill="#f3d79a" font-size="11">skill delta at most 0.0004 after the first run; session B in a new process reproduces every number</text>

  <rect x="655" y="290" width="490" height="100" rx="8" fill="#2a2214" stroke="#d9a441" stroke-width="1.5"/>
  <text x="900" y="315" text-anchor="middle" fill="#f0c060" font-size="12" font-weight="bold">Molaison on the model alone: INVALID eleven times, attributed; the system holds</text>
  <text x="900" y="338" text-anchor="middle" fill="#ffe9bf" font-size="10">six recipes move the prior, not the decision (claims on absent entities 0.20 to 0.88); the organ's mark moves it (0.10, v9)</text>
  <text x="900" y="358" text-anchor="middle" fill="#ffe9bf" font-size="11">a head supervised on "is the entity in the window" learns the prior (0.965 / 0.02; 0.92 / 0.20)</text>
  <text x="900" y="378" text-anchor="middle" fill="#f3d79a" font-size="11">a linear probe on its inputs: 0.505 and 0.647 on held out pairs; the reader reads the window, not the line</text>
  <text x="900" y="398" text-anchor="middle" fill="#8fe0a8" font-size="11">the model decides, the organ answers: PASS on two live seeds (rows 37, 39); seed 1337 agrees post hoc</text>

  <!-- ===== bottom panel: the protocol ===== -->
  <rect x="30" y="440" width="1140" height="290" rx="10" fill="#161a22" stroke="#2b3240"/>
  <text x="600" y="467" text-anchor="middle" fill="#e6e6e6" font-size="16" font-weight="bold">The Molaison dissociation, frozen before any result: four arms, thresholds that never moved</text>

  <!-- four arm boxes -->
  <rect x="55" y="490" width="260" height="120" rx="8" fill="#20242c" stroke="#4a5262"/>
  <text x="185" y="513" text-anchor="middle" fill="#e6e6e6" font-size="12" font-weight="bold">Journal ON</text>
  <text x="185" y="533" text-anchor="middle" fill="#c9ced6" font-size="11">200 leakage proof facts planted</text>
  <text x="185" y="551" text-anchor="middle" fill="#c9ced6" font-size="11">recall must reach 0.50 above OFF</text>
  <text x="185" y="569" text-anchor="middle" fill="#c9ced6" font-size="11">invalid citations at most 0.01</text>
  <text x="185" y="592" text-anchor="middle" fill="#8fe0a8" font-size="11">organ 1.000 · model 0.03 to 0.80 · system ≥ 0.845</text>

  <rect x="335" y="490" width="260" height="120" rx="8" fill="#20242c" stroke="#4a5262"/>
  <text x="465" y="513" text-anchor="middle" fill="#e6e6e6" font-size="12" font-weight="bold">Journal OFF (the lesion)</text>
  <text x="465" y="533" text-anchor="middle" fill="#c9ced6" font-size="11">the same questions, no journal</text>
  <text x="465" y="551" text-anchor="middle" fill="#c9ced6" font-size="11">episodes must vanish</text>
  <text x="465" y="569" text-anchor="middle" fill="#c9ced6" font-size="11">guessing must stay at chance</text>
  <text x="465" y="592" text-anchor="middle" fill="#8fe0a8" font-size="11">organ 0.000 · model 0.000 on every run</text>

  <rect x="615" y="490" width="260" height="120" rx="8" fill="#20242c" stroke="#4a5262"/>
  <text x="745" y="513" text-anchor="middle" fill="#e6e6e6" font-size="12" font-weight="bold">Negative control</text>
  <text x="745" y="533" text-anchor="middle" fill="#c9ced6" font-size="11">50 entities never planted</text>
  <text x="745" y="551" text-anchor="middle" fill="#c9ced6" font-size="11">claims must stay under 0.10</text>
  <text x="745" y="569" text-anchor="middle" fill="#c9ced6" font-size="11">the arm that separates memory from a prior</text>
  <text x="745" y="592" text-anchor="middle" fill="#f0c060" font-size="11">organ ≤ 0.055 · model 0.10 to 0.88 · system 0.000</text>

  <rect x="895" y="490" width="250" height="120" rx="8" fill="#20242c" stroke="#4a5262"/>
  <text x="1020" y="513" text-anchor="middle" fill="#e6e6e6" font-size="12" font-weight="bold">Skill arm</text>
  <text x="1020" y="533" text-anchor="middle" fill="#c9ced6" font-size="11">perplexity with and without the journal</text>
  <text x="1020" y="551" text-anchor="middle" fill="#c9ced6" font-size="11">must move by less than 0.01</text>
  <text x="1020" y="569" text-anchor="middle" fill="#c9ced6" font-size="11">the skills the patient kept</text>
  <text x="1020" y="592" text-anchor="middle" fill="#8fe0a8" font-size="11">organ 0 · model ≤ 0.0004 (v1: 0.0485, fixed)</text>

  <!-- session B and the reading -->
  <rect x="55" y="630" width="1090" height="80" rx="8" fill="#12161c" stroke="#4a5262"/>
  <text x="600" y="655" text-anchor="middle" fill="#e6e6e6" font-size="12" font-weight="bold">Session B: a new process, nothing of session A but the disk, reproduces every number; a memorisation probe scores seen and unseen entities alike</text>
  <text x="600" y="677" text-anchor="middle" fill="#c9ced6" font-size="11">PASS requires all four arms on one seed, "gated" requires three seeds; a failure is a result and is attributed to a named cause before the next run changes one variable</text>
  <text x="600" y="697" text-anchor="middle" fill="#9aa0a6" font-size="11">the organ passed on four seeds; the model alone failed eleven times on nine runs, each attributed (memorisation, class prior, shape cue, constant bias, value copy); the system holds on two live seeds</text>

  <!-- legend -->
  <rect x="30" y="738" width="12" height="12" fill="#1f3a2a" stroke="#3fae6a"/>
  <text x="48" y="748" fill="#9aa0a6" font-size="11">validated</text>
  <rect x="120" y="738" width="12" height="12" fill="#3a2e14" stroke="#d9a441"/>
  <text x="138" y="748" fill="#9aa0a6" font-size="11">measured, the limit</text>
  <rect x="260" y="738" width="12" height="12" fill="#20242c" stroke="#4a5262"/>
  <text x="278" y="748" fill="#9aa0a6" font-size="11">built or specified, not yet measured on the model</text>
</svg>
