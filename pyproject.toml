[project]
name = "quantum-cortex"
version = "0.1.0"
description = "An open-source pure LLM whose cognitive concepts live in the weights and the decode loop. Signature capability: continuity."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "quantum-cortex contributors" }]
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "jsonschema>=4.20",
    "cryptography>=42",   # encryption at rest of the journal (AES-256-GCM); Apache-2.0 OR BSD-3-Clause, checked 2026-09-12
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/vaneeckhoutnicolas/quantum-cortex"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["train"]

[tool.setuptools.packages.find]
include = ["cortex_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["slow: end-to-end tests that train a model (seconds); run in CI"]
# make the repo root importable so `import cortex_data` works without install
pythonpath = ["."]
