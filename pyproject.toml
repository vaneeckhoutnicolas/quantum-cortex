[project]
name = "quantum-cortex"
version = "1.0.0"
description = "An open language model built to measure continuity: a sealed episodic organ outside the weights, a frozen dissociation protocol, and a record that can be audited to the digit."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nicolas Van Eeckhout" }]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "jsonschema>=4.20",
    "cryptography>=42",   # encryption at rest of the journal (AES-256-GCM); Apache-2.0 OR BSD-3-Clause, checked 2026-09-12
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/vaneeckhoutnicolas/quantum-cortex"
Repository = "https://github.com/vaneeckhoutnicolas/quantum-cortex"
Paper = "https://github.com/vaneeckhoutnicolas/quantum-cortex/blob/main/docs/WHITEPAPER.md"
Results = "https://github.com/vaneeckhoutnicolas/quantum-cortex/blob/main/docs/RESULTS.md"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["train"]

[tool.setuptools.packages.find]
include = ["cortex_data*", "cortex_c2*", "cortex_c2b*", "cortex_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["slow: end-to-end tests that train a model (seconds); run in CI"]
# make the repo root importable so `import cortex_data` works without install
pythonpath = ["."]
